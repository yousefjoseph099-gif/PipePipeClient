name: Build custom release APK

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

# If a new build starts while an older one is running, stop the older one.
concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout client (your fork)
        uses: actions/checkout@v4
        with:
          path: PipePipeClient
          fetch-depth: 0

      - name: Checkout extractor
        uses: actions/checkout@v4
        with:
          repository: InfinityLoop1308/PipePipeExtractor
          ref: main
          path: PipePipeExtractor

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64 - release APK cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEY_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: PipePipeClient
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Only the arm64 APK (almost all phones), and only for 3 days: keeps GitHub storage tiny.
      - name: Upload APK (temporary copy)
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-arm64
          path: PipePipeClient/app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 3
          if-no-files-found: error

      # Permanent download link for the newest build. Apps like Obtainium can watch it and
      # tell you when a new version is ready. Only the 3 newest releases are kept.
      - name: Publish release
        working-directory: PipePipeClient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -n 1)
          TAG="build-${{ github.run_number }}"
          SHORT=$(git rev-parse --short HEAD)
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Custom build $TAG" \
            --notes "arm64-v8a build of commit $SHORT" \
            --latest
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            -q 'map(select(.tagName | startswith("build-"))) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r old; do
                gh release delete "$old" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
              done
