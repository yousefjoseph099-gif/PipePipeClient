name: Build custom release APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PipePipeClient (this repo)
        uses: actions/checkout@v4
        with:
          path: PipePipeClient

      # No `ref:` -> latest main. If this ever mismatches your client,
      # pin `ref:` to the submodule SHA from the InfinityLoop1308/PipePipe repo.
      - name: Checkout PipePipeExtractor (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: InfinityLoop1308/PipePipeExtractor
          ref: main
          path: PipePipeExtractor

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: gradle

      - name: Build release APK
        run: |
          cd PipePipeClient
          chmod +x gradlew
          ./gradlew assembleRelease --no-configuration-cache --stacktrace

      - name: Sign release APK(s)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p signed
          for apk in PipePipeClient/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk" | sed 's/-unsigned//')
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --out "signed/$name" "$apk"
            "$BT/apksigner" verify "signed/$name"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-custom-release-apk
          retention-days: 14
          path: signed/*.apk
