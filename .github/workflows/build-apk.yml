name: Build custom debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PipePipeClient (this repo)
        uses: actions/checkout@v4
        with:
          path: PipePipeClient

      # Pin removed: the old SHA was older than your client code, which caused the compile errors.
      - name: Checkout PipePipeExtractor (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: InfinityLoop1308/PipePipeExtractor
          ref: main
          path: PipePipeExtractor

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: gradle

      - name: Build debug APK
        run: |
          cd PipePipeClient
          chmod +x gradlew
          ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-custom-debug-apk
          retention-days: 14
          path: PipePipeClient/app/build/outputs/apk/debug/*.apk
